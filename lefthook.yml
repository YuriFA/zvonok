pre-commit:
  commands:
    openspec-validate:
      glob: "openspec/**"
      run: pnpm openspec:validate

    server-eslint:
      glob: "*.{ts,tsx}"
      root: apps/server
      run: pnpm exec eslint --fix --max-warnings 0 {staged_files}
      stage_fixed: true

    client-lint:
      glob: "*.{ts,tsx}"
      root: apps/client
      run: pnpm exec oxlint --fix {staged_files} && pnpm exec oxfmt {staged_files}
      stage_fixed: true

    pkg-client-lint:
      glob: "*.{ts,tsx}"
      root: packages/client
      run: pnpm exec oxlint --fix {staged_files} && pnpm exec oxfmt {staged_files}
      stage_fixed: true

    pkg-react-lint:
      glob: "*.{ts,tsx}"
      root: packages/react
      run: pnpm exec oxlint --fix {staged_files} && pnpm exec oxfmt {staged_files}
      stage_fixed: true

    pkg-video-layout-lint:
      glob: "*.{ts,tsx}"
      root: packages/video-layout
      run: pnpm exec oxlint --fix {staged_files} && pnpm exec oxfmt {staged_files}
      stage_fixed: true

    pkg-whiteboard-core-lint:
      glob: "*.{ts,tsx}"
      root: packages/whiteboard-core
      run: pnpm exec oxlint --fix {staged_files} && pnpm exec oxfmt {staged_files}
      stage_fixed: true

    pkg-whiteboard-react-lint:
      glob: "*.{ts,tsx}"
      root: packages/whiteboard-react
      run: pnpm exec oxlint --fix {staged_files} && pnpm exec oxfmt {staged_files}
      stage_fixed: true

    typecheck:
      glob: "**/*.{ts,tsx}"
      run: pnpm lint:ts

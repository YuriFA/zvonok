# Prometheus scrape targets. Prometheus runs in host network mode, so every
# target is host loopback:
#   3000  zvonok server (host network since 542b60c; /metrics)
#   9100  node_exporter (host hardware/OS metrics)
#   9187  postgres_exporter (zvonok postgres via 127.0.0.1:5432)
#   8082  Traefik (per-site router metrics, loopback-published by ~/gateway)
# Per-container liveness is covered by Uptime Kuma Docker monitors, not
# Prometheus: cAdvisor cannot read Docker 28 containerd-snapshotter layers.

global:
  scrape_interval: 15s

scrape_configs:
  - job_name: zvonok-app
    static_configs:
      - targets: [localhost:3000]
  - job_name: node
    static_configs:
      - targets: [localhost:9100]
  - job_name: postgres
    static_configs:
      - targets: [localhost:9187]
  - job_name: traefik
    static_configs:
      - targets: [localhost:8082]

# Grafana alert rules, provisioned. Routing is a one-time UI step: create a
# Telegram contact point (bot token from @BotFather + chat id) and set it as
# the default notification policy - see README.md.
apiVersion: 1

groups:
  - orgId: 1
    name: zvonok-host
    folder: Zvonok
    interval: 1m
    rules:
      - uid: host-disk-warn
        title: Disk usage above 80 percent
        condition: C
        for: 5m
        annotations:
          summary: Disk usage on the VPS is above 80 percent
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
                  / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"})
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: A
              type: threshold
              conditions:
                - evaluator: { type: gt, params: [0.8] }

      - uid: host-disk-crit
        title: Disk usage above 90 percent
        condition: C
        for: 5m
        annotations:
          summary: Disk usage on the VPS is above 90 percent
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                1 - (node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay"}
                  / node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay"})
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: A
              type: threshold
              conditions:
                - evaluator: { type: gt, params: [0.9] }

      - uid: host-memory-crit
        title: Memory usage above 90 percent
        condition: C
        for: 5m
        annotations:
          summary: RAM usage on the VPS is above 90 percent
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: A
              type: threshold
              conditions:
                - evaluator: { type: gt, params: [0.9] }

      - uid: scrape-target-down
        title: Scrape target down for 5 minutes
        condition: C
        for: 5m
        annotations:
          summary: 'Prometheus cannot scrape {{ $labels.job }} ({{ $labels.instance }})'
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: up
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: A
              type: threshold
              conditions:
                - evaluator: { type: lt, params: [1] }

      - uid: container-down
        title: Critical container down for 2 minutes
        condition: C
        for: 2m
        annotations:
          summary: 'Container {{ $labels.name }} has not been seen for 2 minutes'
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: |
                time() - container_last_seen{name=~"zvonok-server|zvonok-postgres|zvonok-coturn|traefik"}
          - refId: C
            relativeTimeRange: { from: 600, to: 0 }
            model:
              expr: A
              type: threshold
              conditions:
                - evaluator: { type: gt, params: [120] }

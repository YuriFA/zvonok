name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SERVER_IMAGE: ghcr.io/${{ github.repository }}/server
  MIGRATOR_IMAGE: ghcr.io/${{ github.repository }}/migrator
  CADDY_IMAGE: ghcr.io/${{ github.repository }}/caddy
  DOCS_IMAGE: ghcr.io/${{ github.repository }}/docs

jobs:
  build-server:
    name: Build & Push Server + Migrator
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.image-tag.outputs.value }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tag
        id: image-tag
        run: echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (server)
        id: meta-server
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.SERVER_IMAGE }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.value }}
            type=raw,value=latest

      - name: Build and push server image
        id: build-server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-server.outputs.tags }}
          labels: ${{ steps.meta-server.outputs.labels }}
          cache-from: type=gha,scope=server-build
          cache-to: type=gha,scope=server-build,mode=max

      - name: Extract metadata (migrator)
        id: meta-migrator
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.MIGRATOR_IMAGE }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.value }}
            type=raw,value=latest

      - name: Build and push migrator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: migrator
          push: true
          tags: ${{ steps.meta-migrator.outputs.tags }}
          labels: ${{ steps.meta-migrator.outputs.labels }}
          cache-from: type=gha,scope=server-build
          cache-to: type=gha,scope=migrator-build,mode=max

  build-caddy:
    name: Build & Push Caddy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: image-tag
        run: echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (caddy)
        id: meta-caddy
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.CADDY_IMAGE }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.value }}
            type=raw,value=latest

      - name: Build and push caddy image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/client/Dockerfile
          push: true
          tags: ${{ steps.meta-caddy.outputs.tags }}
          labels: ${{ steps.meta-caddy.outputs.labels }}
          cache-from: type=gha,scope=caddy-build
          cache-to: type=gha,scope=caddy-build,mode=max

  build-docs:
    name: Build & Push Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: image-tag
        run: echo "value=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (docs)
        id: meta-docs
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCS_IMAGE }}
          tags: |
            type=raw,value=${{ steps.image-tag.outputs.value }}
            type=raw,value=latest

      - name: Build and push docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docs/Dockerfile.docs
          push: true
          tags: ${{ steps.meta-docs.outputs.tags }}
          labels: ${{ steps.meta-docs.outputs.labels }}
          cache-from: type=gha,scope=docs-build
          cache-to: type=gha,scope=docs-build,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-server, build-caddy, build-docs]
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
    steps:
      - name: Checkout (for compose files)
        uses: actions/checkout@v4

      - name: Copy compose files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile.traefik,Caddyfile.routes,turnserver.conf"
          target: ~/zvonOK

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          REGISTRY: ghcr.io
          GITHUB_REPOSITORY: ${{ github.repository }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ needs.build-server.outputs.image-tag }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: REGISTRY,GITHUB_REPOSITORY,GHCR_TOKEN,GITHUB_ACTOR,IMAGE_TAG
          script: |
            set -e
            export GHCR_REPO="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"

            cd ~/zvonOK

            # Shared docker network with the Traefik gateway (idempotent)
            docker network create web 2>/dev/null || true

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.prod.yml pull

            IMAGE_TAG="${IMAGE_TAG}" docker compose -f docker-compose.prod.yml up -d --remove-orphans

            docker images --format "{{.Repository}}:{{.Tag}} {{.ID}}" \
              | grep "^ghcr.io/${GHCR_REPO}/" \
              | grep -v ":${IMAGE_TAG} \|:latest " \
              | awk '{print $2}' \
              | sort -u \
              | xargs -r docker rmi || true

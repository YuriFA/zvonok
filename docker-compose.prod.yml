# docker-compose.prod.yml — Production deployment (pulls pre-built images from GHCR)
#
# This file is used on the VPS. Images are built and pushed by GitHub Actions.
#
# Usage:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Required:
#   - .env file with production values (see .env.production.example)
#   - GHCR_REPO env var set to the GitHub repository (e.g., user/zvonok)
#   - Logged in to ghcr.io: echo $TOKEN | docker login ghcr.io -u USER --password-stdin

services:
  # --- Database migrations (runs once before server starts) ---
  migrate:
    image: ghcr.io/${GHCR_REPO}/migrator:${IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # --- NestJS backend ---
  server:
    image: ghcr.io/${GHCR_REPO}/server:${IMAGE_TAG:-latest}
    container_name: zvonok-server
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      PORT: ${PORT:-3000}
      # Host network mode: container DNS is unavailable - postgres is reached
      # via its loopback-only host publish below.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN_MINUTES: ${JWT_ACCESS_EXPIRES_IN_MINUTES:-15}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-7}
      CLIENT_URL: ${CLIENT_URL:-https://localhost}
      NODE_ENV: production
      # mediasoup network
      MEDIASOUP_LISTEN_IP: ${MEDIASOUP_LISTEN_IP:-0.0.0.0}
      MEDIASOUP_ANNOUNCED_IP: ${MEDIASOUP_ANNOUNCED_IP:-127.0.0.1}
      RTC_MIN_PORT: ${RTC_MIN_PORT:-40000}
      RTC_MAX_PORT: ${RTC_MAX_PORT:-40099}
      # TURN credentials (sent to clients as ICE servers)
      TURN_URL: ${TURN_URL:-}
      TURNS_URL: ${TURNS_URL:-}
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET:-}
      # Developer platform: console sessions + /v1 room tokens
      JWT_DEV_SECRET: ${JWT_DEV_SECRET}
      JWT_ROOM_SECRET: ${JWT_ROOM_SECRET}
      ROOM_TOKEN_TTL_MINUTES: ${ROOM_TOKEN_TTL_MINUTES:-60}
      # Egress: RTP ingest range + durable HLS/recordings on the egress_data volume
      EGRESS_MEDIA_PORT_MIN: ${EGRESS_MEDIA_PORT_MIN:-42000}
      EGRESS_MEDIA_PORT_MAX: ${EGRESS_MEDIA_PORT_MAX:-42100}
      EGRESS_HLS_DIR: ${EGRESS_HLS_DIR:-/data/egress-hls}
      EGRESS_RECORDINGS_DIR: ${EGRESS_RECORDINGS_DIR:-/data/egress-recordings}
      # Error reporting (GlitchTip); unset or empty disables it entirely
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      coturn:
        condition: service_started
    restart: unless-stopped
    # Host network: mediasoup binds the RTC port range (RTC_MIN_PORT..RTC_MAX_PORT)
    # directly on the host. Publishing 100 ports (tcp+udp, IPv4+IPv6) through
    # Docker spawns ~400 docker-proxy processes and puts a userland hop on
    # every RTP packet. Container DNS is unavailable in host mode: postgres is
    # reached via 127.0.0.1 (loopback publish below), Caddy via
    # host.docker.internal (SERVER_UPSTREAM).
    # Firewall: PORT (3000) binds directly on the host and must never be open
    # to the internet - allow it only from Docker subnets (docs/deployment.md).
    network_mode: host
    volumes:
      - egress_data:/data

  # --- PostgreSQL database ---
  postgres:
    image: postgres:16-alpine
    container_name: zvonok-postgres
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    expose:
      - "5432"
    # Loopback-only host publish: the host-networked server reaches the
    # database via 127.0.0.1:5432. Not reachable from the internet.
    ports:
      - "127.0.0.1:5432:5432"

  # --- Caddy reverse proxy (with baked-in client assets) ---
  # Behind the shared Traefik gateway (~/gateway on the VPS): Traefik owns
  # host ports 80/443 and terminates TLS; Caddy serves plain HTTP internally.
  caddy:
    image: ghcr.io/${GHCR_REPO}/caddy:${IMAGE_TAG:-latest}
    container_name: zvonok-caddy
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "3"
    expose:
      - "80"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      # The server runs in host network mode - reach it via the host, not
      # container DNS (consumed by Caddyfile.routes).
      SERVER_UPSTREAM: host.docker.internal:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile.traefik:/etc/caddy/Caddyfile:ro
      - ./Caddyfile.routes:/etc/caddy/Caddyfile.routes:ro
      - caddy_data:/data
      - caddy_config:/config
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zvonok.rule=Host(`${SITE_ADDRESS}`)"
      - "traefik.http.routers.zvonok.entrypoints=websecure"
      - "traefik.http.routers.zvonok.tls.certresolver=le"
      - "traefik.http.services.zvonok.loadbalancer.server.port=80"
    depends_on:
      server:
        condition: service_started
    networks:
      - default
      - web
    restart: unless-stopped

  # --- Docs site (static VitePress output served by nginx) ---
  # Behind the shared Traefik gateway: docs.<domain> routes here over the
  # shared `web` network. Independent from the app's Caddy edge - a docs
  # rebuild never restarts the main site.
  docs:
    image: ghcr.io/${GHCR_REPO}/docs:${IMAGE_TAG:-latest}
    container_name: zvonok-docs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.zvonok-docs.rule=Host(`docs.${SITE_ADDRESS}`)"
      - "traefik.http.routers.zvonok-docs.entrypoints=websecure"
      - "traefik.http.routers.zvonok-docs.tls.certresolver=le"
      - "traefik.http.services.zvonok-docs.loadbalancer.server.port=80"
    networks:
      - web
    restart: unless-stopped

  # --- coturn TURN/STUN server ---
  coturn:
    image: coturn/coturn:alpine
    container_name: zvonok-coturn
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --external-ip=${TURN_EXTERNAL_IP}
      - --realm=${SITE_ADDRESS:-localhost}
      - --static-auth-secret=${TURN_AUTH_SECRET}
    restart: unless-stopped

networks:
  default:
  # Shared with the Traefik gateway and other sites on the same VPS
  web:
    external: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  egress_data:
